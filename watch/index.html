<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="../favicon.png" type="image/png" />

    <title>5-Minute Set — Nishil Shah</title>
    <meta name="description" content="A stand-up set from Nishil Shah, NYC-based comedian." />

    <!-- Share preview uses the video's thumbnail. -->
    <meta property="og:type" content="video.other" />
    <meta property="og:title" content="Nishil Shah — 5-minute set" />
    <meta property="og:description" content="A stand-up set from Nishil Shah, NYC-based comedian." />
    <meta property="og:image" content="https://img.youtube.com/vi/jST7wiKmfpk/maxresdefault.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        color: #111;
        background: #fff;
        --accent: #8a2b3b;
      }

      .watch {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 1.5rem;
        gap: 0.75rem;
      }

      .watch-back {
        position: fixed;
        top: 1.25rem;
        left: 1.5rem;
        z-index: 1;
        font-size: 0.95rem;
        color: inherit;
        text-decoration: none;
        border-bottom: 1px solid rgba(0, 0, 0, 0.3);
      }

      .watch-back:hover {
        border-bottom-color: rgba(0, 0, 0, 0.7);
      }

      .watch-inner {
        width: 100%;
        max-width: 720px;
      }

      /* Responsive 16:9 video frame. */
      .watch-frame {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        border-radius: 8px;
        overflow: hidden;
        background: #000;
      }

      .watch-frame iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }

      .watch-caption {
        margin: 0.75rem 0 0 0;
        font-size: 0.9rem;
        font-style: italic;
        color: #666;
      }
    </style>
  </head>

  <body>
    <main class="watch">
      <a class="watch-back" href="../index.html">← Home</a>

      <div class="watch-inner">
        <div class="watch-frame" id="watch-frame"></div>
        <p class="watch-caption" id="watch-caption"></p>
      </div>
    </main>

    <script src="../watch-config.js"></script>
    <script>
      (function () {
        var cfg = window.WATCH || {};
        // If the video is turned off, don't expose the page.
        if (!cfg.enabled || !cfg.videoId) {
          location.replace("../index.html");
          return;
        }
        var iframe = document.createElement("iframe");
        iframe.src = "https://www.youtube-nocookie.com/embed/" + cfg.videoId;
        iframe.title = "Nishil Shah — 5-minute set";
        iframe.loading = "lazy";
        iframe.setAttribute(
          "allow",
          "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        );
        iframe.allowFullscreen = true;
        document.getElementById("watch-frame").appendChild(iframe);
        var caption = document.getElementById("watch-caption");
        if (caption) caption.textContent = cfg.caption || "";
      })();
    </script>
  </body>
</html>

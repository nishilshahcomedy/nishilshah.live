<!DOCTYPE html>
<!--
  SELF-PRODUCED SHOW LANDING PAGE TEMPLATE
  ----------------------------------------
  Styles live in /event.css and the signup logic in /event.js — shared by every
  show page, so fixes there apply everywhere. Only edit per-show CONTENT here.

  To make a new show page:
    1. Copy this whole folder and rename it to the URL slug you want,
       e.g.  show-template/  ->  oct25/   (lives at nishilshah.live/oct25)
    2. Fill in every [PLACEHOLDER] below (title, date, venue, price, blurb,
       links) and the OG share tags in <head>.
    3. Drop your flyer art in the folder as flyer.png (1080x1350, 4:5) and
       point the <img> + og:image at it.
    4. Set the signup form's hidden fields[source] to this show's slug.
    5. Add one line to the SHOWS array in /shows.js:
         { date: "2026-10-25", venue: "[Show Name]", city: "Brooklyn, NY",
           url: "/[slug]", mine: true, featured: true },
  The page is locked to one viewport height — keep copy short so it never scrolls.

  TWO RULES worth keeping (learned on the Oct 25 page):
    • No "← All Shows" link and no "Nishil Shah Presents" kicker. This page
      should convert to a ticket, not leak traffic to other people's shows,
      and the flyer already has your name on it.
    • If the flyer lists the lineup, don't repeat it in the info column — put
      the names in the flyer's alt text instead so they still exist as text.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="../favicon.png" type="image/png" />

    <title>[SHOW NAME] — Nishil Shah</title>
    <meta name="description" content="[SHOW NAME] — live stand-up at [Venue], [Borough]. [Day, Month DD]. $[X] early bird." />

    <!-- Social share preview (per-page — scrapers don't run JS, so it can't be
         shared). Use absolute URLs, e.g. https://nishilshah.live/[slug]/flyer.png
         NOTE: previews crop to ~1.91:1, so a 4:5 flyer loses its top and bottom.
         Export a wide version for og:image if the date/venue sit near an edge. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="[SHOW NAME] — Nishil Shah" />
    <meta property="og:description" content="Live stand-up at [Venue], [Borough] — [Day, Month DD]. $[X] early bird." />
    <meta property="og:image" content="https://nishilshah.live/[SLUG]/flyer.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="../theme.css" />
    <link rel="stylesheet" href="../event.css" />
  </head>

  <body>
    <main class="event">
      <!-- LEFT on laptop, TOP on mobile. -->
      <div class="event-flyer">
        <!-- Alt text is the only text copy of anything printed on the flyer
             (lineup, host, show time) — write it out in full. -->
        <img
          class="event-poster"
          src="flyer.png"
          alt="[SHOW NAME] — live stand-up, [time] [Day Month DD YYYY] at [Venue]. Featuring [Comic], [Comic], [Comic]. Hosted by [Host]."
        />
      </div>

      <!-- RIGHT on laptop, BELOW on mobile. -->
      <div class="event-info">
        <h1 class="event-title">[SHOW NAME]</h1>
        <p class="event-details">[Sun, Oct 25] · [Venue] ([Street Address], [Borough])</p>
        <p class="event-blurb">
          [One or two punchy lines that sell the night. Keep it short so the
          page stays on one screen.]
        </p>

        <!-- Price above the button, doors below it. Show price so nobody has to
             click through to learn it's cheap; the box office page carries the
             show time, so doors is the only time worth stating here. -->
        <p class="event-price">$[X] early bird · $[Y] after</p>
        <!-- Links out to the club/venue box office to actually buy tickets. -->
        <a
          class="event-tickets"
          href="[CLUB TICKET URL]"
          target="_blank"
          rel="noopener"
          >Get Tickets</a
        >
        <p class="event-doors">Doors @ [7:30]</p>

        <!-- On mobile this group pins to the bottom as a card (see event.css). -->
        <div class="event-signup-card">
          <p class="event-signup-prompt">Can't make it? Sign up for the next one <svg class="event-signup-arrow" width="16" height="16" viewBox="0 0 512 512" fill="currentColor" aria-hidden="true"><polygon points="283.7,298.7 283.7,0 198.3,0 198.3,298.7 70.3,298.7 241,512 411.7,298.7" /></svg></p>

          <!--
            Posts to Kit (form 9759877) via /event.js. To also capture city, add a
            custom field in Kit, then add an input here named fields[city].
          -->
          <form class="event-signup" action="https://app.kit.com/forms/9759877/subscriptions" method="post">
            <input type="email" name="email_address" placeholder="you@email.com" required />
            <!-- Attribution: set value to this show's slug. Needs a "source"
                 custom field in Kit to actually record. -->
            <input type="hidden" name="fields[source]" value="show-slug" />
            <button type="submit">Notify me</button>
          </form>
          <p class="event-signup-done" hidden>Thanks for signing up!</p>
        </div>
      </div>
    </main>

    <script src="../event.js"></script>
    <script defer src="../analytics.js"></script>
  </body>
</html>

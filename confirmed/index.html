<!DOCTYPE html>
<!--
  CONFIRMATION SUCCESS PAGE — nishilshah.live/confirmed
  Where subscribers land after clicking "confirm" in the Kit double opt-in email.
  Set this as the "after confirmation" redirect URL in Kit
  (Form 9759877 → Settings → Incentive → after confirmation → redirect).
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="../favicon.png" type="image/png" />

    <title>You're in — Nishil Shah</title>
    <meta name="description" content="You're on the list. See you at a show." />
    <meta name="robots" content="noindex" />

    <link rel="stylesheet" href="../theme.css" />

    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        color: var(--text);
        background: var(--bg);
        overflow: hidden;
      }

      .confirmed {
        min-height: 100vh;
        min-height: 100dvh;
        max-width: 460px;
        margin: 0 auto;
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: flex-start;
        gap: 0.85rem;
      }

      .confirmed-photo {
        width: 140px;
        height: 140px;
        object-fit: cover;
        border-radius: 6px;
        margin-bottom: 1.25rem;
      }

      .confirmed-eyebrow {
        margin: 0;
        font-size: 0.85rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--accent);
      }

      .confirmed-title {
        margin: 0;
        font-size: 1.9rem;
        font-weight: 600;
        line-height: 1.2;
      }

      .confirmed-copy {
        margin: 0;
        font-size: 1rem;
        line-height: 1.5;
        color: var(--text-body);
        max-width: 42ch;
      }

      .confirmed-links {
        margin-top: 0.75rem;
        display: flex;
        flex-wrap: wrap;
        gap: 1.25rem;
      }

      .confirmed-links a {
        font-size: 0.95rem;
        color: inherit;
        text-decoration: none;
        border-bottom: 1px solid rgba(0, 0, 0, 0.3);
      }

      .confirmed-links a:hover {
        border-bottom-color: rgba(0, 0, 0, 0.7);
      }
    </style>
  </head>

  <body>
    <main class="confirmed">
      <img class="confirmed-photo" src="../images/portrait.jpg" alt="Nishil Shah" />

      <h1 class="confirmed-title">You're in</h1>
      <p class="confirmed-copy">
        Thanks a lot! See you at a show soon
      </p>

      <nav class="confirmed-links">
        <a href="../">See upcoming shows →</a>
        <a href="https://instagram.com/nishilshah12" target="_blank" rel="noopener">Instagram</a>
      </nav>
    </main>
  </body>
</html>

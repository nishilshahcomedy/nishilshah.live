<!DOCTYPE html>
<!--
  REDIRECT STUB — nishilshah.live/oct25  ->  nishilshah.live/on-oct-25
  The real show page lives at /on-oct-25. This just forwards the shorter link
  there so both work. If you ever flip which slug is canonical, swap the URL
  below (and the one in the <a> fallback).
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redirecting…</title>
    <link rel="canonical" href="https://nishilshah.live/on-oct-25/" />
    <meta http-equiv="refresh" content="0; url=/on-oct-25/" />
    <script>
      // Instant client-side redirect (fires before the meta refresh in practice).
      window.location.replace("/on-oct-25/");
    </script>
  </head>
  <body>
    <p>Redirecting to <a href="/on-oct-25/">the show page</a>…</p>
  </body>
</html>

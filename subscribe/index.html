<!DOCTYPE html>
<!--
  MAILING LIST SIGNUP — nishilshah.live/subscribe
  A focused, single-purpose page to link from your IG bio, a QR code at shows,
  texts, etc. Mirrors the home intro (photo + name) up top, signup below.
  Reuses the Kit form + shared /event.js submit logic.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="../favicon.png" type="image/png" />

    <title>Mailing List — Nishil Shah</title>
    <meta name="description" content="Sign up and Nishil Shah will email you when there's a show worth coming to. Nothing else!" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Nishil Shah — Mailing List" />
    <meta property="og:description" content="Sign up and I'll email you when there's a show I want you to come to. Nothing else!" />
    <meta property="og:image" content="https://nishilshah.live/images/portrait.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        color: #111;
        background: #fff;
        --accent: #8a2b3b;
        overflow: hidden;
      }

      /* Left-aligned, vertically centered: intro up top, signup below. */
      .subscribe {
        min-height: 100vh;
        min-height: 100dvh;
        max-width: 460px;
        margin: 0 auto;
        padding: 2rem 1.5rem;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: flex-start;
        gap: 2.5rem;
      }

      .subscribe-back {
        position: fixed;
        top: 1.25rem;
        left: 1.5rem;
        z-index: 1;
        font-size: 0.95rem;
        color: inherit;
        text-decoration: none;
        border-bottom: 1px solid rgba(0, 0, 0, 0.3);
      }

      .subscribe-back:hover {
        border-bottom-color: rgba(0, 0, 0, 0.7);
      }

      /* --- Intro (mirrors the home page) --- */
      .subscribe-intro {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
      }

      .subscribe-photo {
        width: 140px;
        height: 140px;
        object-fit: cover;
        border-radius: 6px;
        margin-bottom: 1.25rem;
      }

      .subscribe-name {
        margin: 0 0 0.4rem 0;
        font-size: 1.9rem;
        font-weight: 500;
        line-height: 1.2;
      }

      .subscribe-bio {
        margin: 0;
        font-size: 1rem;
        line-height: 1.5;
        color: #333;
      }

      /* --- Signup --- */
      .subscribe-signup {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 0.75rem;
        width: 100%;
      }

      .subscribe-heading {
        margin: 0;
        font-size: 1.15rem;
        font-weight: 500;
        line-height: 1.2;
      }

      .subscribe-copy {
        margin: 0;
        font-size: 1rem;
        line-height: 1.6;
        color: #333;
        max-width: 40ch;
      }

      /* Reuses .event-signup classes so shared /event.js drives the submit. */
      .event-signup {
        display: flex;
        gap: 0.5rem;
        width: 100%;
        max-width: 360px;
        margin-top: 0.25rem;
      }

      .event-signup input {
        flex: 1;
        min-width: 0;
        padding: 0.55rem 0.75rem;
        border: 1px solid #ccc;
        border-radius: 6px;
        /* 16px so iOS doesn't auto-zoom on focus. */
        font-size: 1rem;
      }

      /* Filled oxblood — signing up is this page's whole purpose. */
      .event-signup button {
        padding: 0.55rem 1.2rem;
        border: 1px solid var(--accent);
        border-radius: 6px;
        background: var(--accent);
        color: #fff;
        font-size: 1rem;
        cursor: pointer;
        white-space: nowrap;
      }

      .event-signup button:hover {
        opacity: 0.9;
      }

      .event-signup[hidden] {
        display: none;
      }

      .event-signup-done {
        margin: 0.25rem 0 0 0;
        font-size: 1rem;
        font-weight: 500;
        color: #111;
      }
    </style>
  </head>

  <body>
    <main class="subscribe">
      <a class="subscribe-back" href="../index.html">← Home</a>

      <div class="subscribe-intro">
        <img class="subscribe-photo" src="../images/portrait.jpg" alt="Portrait of Nishil Shah" />
        <h1 class="subscribe-name">Nishil Shah</h1>
        <p class="subscribe-bio">NYC-based standup comedian.</p>
      </div>

      <div class="subscribe-signup">
        <h2 class="subscribe-heading">Get show updates</h2>
        <p class="subscribe-copy event-signup-prompt">
          Sign up and I'll email you when there's a show I want you to come to. Nothing else!
        </p>

        <form class="event-signup" action="https://app.kit.com/forms/9759877/subscriptions" method="post">
          <input type="email" name="email_address" placeholder="you@email.com" required />
          <button type="submit">Sign me up</button>
        </form>
        <p class="event-signup-done" hidden>Thanks for signing up!</p>
      </div>
    </main>

    <script src="../event.js"></script>
    <script defer src="../analytics.js"></script>
  </body>
</html>

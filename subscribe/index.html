<!DOCTYPE html>
<!--
  MAILING LIST SIGNUP — nishilshah.live/subscribe
  A focused, single-purpose page to link from your IG bio, a QR code at shows,
  texts, etc. Intro (photo + name) up top, then a callout for the one show we
  want to push, then signup. Reuses the Kit form + shared /event.js logic.

  NOTE: this page deliberately does NOT link to the home page / all-shows list —
  it should only ever point at a self-produced show.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="../favicon.png" type="image/png" />

    <title>Mailing List — Nishil Shah</title>
    <meta name="description" content="Sign up and Nishil Shah will let you know when he has another show. Nothing else!" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Nishil Shah — Mailing List" />
    <meta property="og:description" content="Sign up and I'll let you know when I have another show. Nothing else!" />
    <meta property="og:image" content="https://nishilshah.live/images/portrait.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="../theme.css" />

    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        color: var(--text);
        background: var(--bg);
        overflow: hidden;
      }

      /* Left-aligned, vertically centered: intro up top, signup below. */
      .subscribe {
        min-height: 100vh;
        min-height: 100dvh;
        max-width: 460px;
        margin: 0 auto;
        /* Top padding clears the fixed show banner (~3.2rem tall). */
        padding: 5.2rem 1.5rem 2rem;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: flex-start;
        gap: 2.5rem;
      }

      /* Show banner — pinned across the top, the whole bar is the link.
         Keeps the page body a pure mailing-list signup while still pushing the
         one show we want traffic on. Deliberately NOT a link to the home page /
         all-shows list. After Oct 25, repoint it or delete the <a> entirely. */
      .subscribe-banner {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 10;
        display: block;
        padding: 1rem;
        /* 80% of --accent (#7a45cf). Set on the BACKGROUND, not via opacity on
           the element, so the white text stays fully opaque. */
        background: rgba(122, 69, 207, 0.8);
        color: #fff;
        font-size: 0.85rem;
        font-weight: 500;
        text-align: center;
        text-decoration: none;
      }

      .subscribe-banner:hover {
        background: var(--accent-dark);
      }

      /* --- Intro (mirrors the home page) --- */
      .subscribe-intro {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
      }

      .subscribe-photo {
        width: 140px;
        height: 140px;
        object-fit: cover;
        border-radius: 6px;
        margin-bottom: 1.25rem;
      }

      .subscribe-name {
        margin: 0 0 0.4rem 0;
        font-size: 1.9rem;
        font-weight: 500;
        line-height: 1.2;
      }

      .subscribe-bio {
        margin: 0;
        font-size: 1rem;
        line-height: 1.5;
        color: var(--text-body);
      }

      /* --- Signup --- */
      .subscribe-signup {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 0.75rem;
        width: 100%;
      }

      .subscribe-heading {
        margin: 0;
        font-size: 1.15rem;
        font-weight: 500;
        line-height: 1.2;
      }

      .subscribe-copy {
        margin: 0;
        font-size: 1rem;
        line-height: 1.6;
        color: var(--text-body);
        max-width: 40ch;
      }

      /* Reuses .event-signup classes so shared /event.js drives the submit. */
      .event-signup {
        display: flex;
        gap: 0.5rem;
        width: 100%;
        max-width: 360px;
        margin-top: 0.25rem;
      }

      .event-signup input {
        flex: 1;
        min-width: 0;
        padding: 0.55rem 0.75rem;
        border: 1px solid var(--border);
        border-radius: 6px;
        /* 16px so iOS doesn't auto-zoom on focus. */
        font-size: 1rem;
      }

      /* Filled accent (purple) — signing up is this page's whole purpose. */
      .event-signup button {
        padding: 0.55rem 1.2rem;
        border: 1px solid var(--accent);
        border-radius: 6px;
        background: var(--accent);
        color: #fff;
        font-size: 1rem;
        cursor: pointer;
        white-space: nowrap;
      }

      .event-signup button:hover {
        opacity: 0.9;
      }

      .event-signup[hidden] {
        display: none;
      }

      .event-signup-done {
        margin: 0.25rem 0 0 0;
        font-size: 1rem;
        font-weight: 500;
        color: var(--text);
      }

      /* Short phones: the page can't scroll (overflow:hidden), so tighten the
         stack rather than let the signup get clipped off the bottom. */
      @media (max-height: 680px) {
        .subscribe {
          gap: 1.5rem;
          /* Still clears the fixed banner — just tighter everywhere else. */
          padding: 4.7rem 1.5rem 1.5rem;
        }

        .subscribe-photo {
          width: 100px;
          height: 100px;
          margin-bottom: 0.9rem;
        }
      }
    </style>
  </head>

  <body>
    <!-- Points at the Oct 25 show only. After Oct 25, repoint or delete. -->
    <a class="subscribe-banner" href="../on-oct-25/">Next show: Nishil Shah + Friends · Sun, Oct 25 →</a>

    <main class="subscribe">
      <div class="subscribe-intro">
        <img class="subscribe-photo" src="../images/portrait.jpg" alt="Portrait of Nishil Shah" />
        <h1 class="subscribe-name">Nishil Shah</h1>
      </div>

      <div class="subscribe-signup">
        <h2 class="subscribe-heading">Get show updates</h2>
        <p class="subscribe-copy event-signup-prompt">
          Sign up and I'll let you know when I have another show. Nothing else!
        </p>

        <form class="event-signup" action="https://app.kit.com/forms/9759877/subscriptions" method="post">
          <input type="email" name="email_address" placeholder="you@email.com" required />
          <!-- Attribution: needs a "source" custom field created in Kit to record. -->
          <input type="hidden" name="fields[source]" value="subscribe" />
          <button type="submit">Sign me up</button>
        </form>
        <p class="event-signup-done" hidden>Thanks for signing up!</p>
      </div>
    </main>

    <script src="../event.js"></script>
    <script defer src="../analytics.js"></script>
  </body>
</html>

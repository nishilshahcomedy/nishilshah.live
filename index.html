<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <title>Nishil Shah</title>

    <meta
      name="description"
      content="Nishil Shah — NYC-based standup comedian."
    />

    <!-- Link preview card (iMessage, Instagram, X, WhatsApp, etc.). -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nishilshah.live/" />
    <meta property="og:title" content="Nishil Shah" />
    <meta property="og:description" content="NYC-based standup comedian." />
    <meta property="og:image" content="https://nishilshah.live/images/portrait.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nishil Shah" />
    <meta name="twitter:description" content="NYC-based standup comedian." />
    <meta name="twitter:image" content="https://nishilshah.live/images/portrait.jpg" />

    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <main class="page">
      <!-- Intro -->
      <section class="intro">
        <img
          src="images/portrait.jpg"
          alt="Portrait of Nishil Shah"
          class="portrait"
        />

        <h1 class="name">Nishil Shah</h1>

        <p class="bio">
          NYC-based standup comedian.
        </p>

        <nav class="links">
          <a href="https://instagram.com/nishilshah12" target="_blank">Instagram</a>
          <a href="mailto:bookings@nishilshah.live">bookings@nishilshah.live</a>
        </nav>

        <p class="watch-line" id="watch-line" hidden>
          <span class="watch-arrow" aria-hidden="true">➡️</span>
          <a class="watch-link" href="watch/index.html">5-minute set</a>
        </p>
        <p class="watch-note" id="watch-note" hidden></p>
      </section>

      <!-- Upcoming Shows -->
      <aside class="shows">
        <div class="shows-header">2026 SHOWS</div>
        <div class="shows-list"></div>
      </aside>
    </main>

    <script src="shows.js"></script>
    <script>
      // Show data lives in shows.js (window.SHOWS). Edit that file to add/edit shows.
      const shows = window.SHOWS || [];

      const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

      // Parse the date parts by hand so there's no timezone shift (e.g. a UTC
      // date rendering as the previous day in New York).
      function formatShowDate(iso) {
        const [, month, day] = iso.split("-").map(Number);
        return MONTHS[month - 1] + " " + day;
      }

      // Today as a local YYYY-MM-DD string, so it compares directly against the
      // show dates without any timezone drift.
      function todayISO() {
        const now = new Date();
        const y = now.getFullYear();
        const m = String(now.getMonth() + 1).padStart(2, "0");
        const d = String(now.getDate()).padStart(2, "0");
        return y + "-" + m + "-" + d;
      }

      // Build one card. Past shows stay dimmed but remain clickable when they
      // have a link — it points at the (now-ended) event page for reference,
      // labeled "View Event" rather than "Get Tickets".
      function buildCard(show, isPast) {
        const clickable = !!show.url;
        const external = clickable && /^https?:\/\//.test(show.url);
        const card = document.createElement(clickable ? "a" : "div");
        card.className = "show-card";
        if (isPast) card.classList.add("past");
        if (show.mine) card.classList.add("mine");
        // Featured (headline) show: filled accent hero card.
        if (show.featured) card.classList.add("featured");
        if (clickable) {
          card.href = show.url;
          // Only external links open a new tab; internal pages stay in-tab.
          if (external) {
            card.target = "_blank";
            card.rel = "noopener";
          }
        }

        const content = document.createElement("div");
        content.className = "show-content";

        if (show.mine) {
          const badge = document.createElement("div");
          badge.className = "show-badge";
          badge.textContent = "NISHIL PRESENTS";
          content.appendChild(badge);
        }

        const title = document.createElement("div");
        title.className = "show-title";
        title.textContent = show.venue + " — " + formatShowDate(show.date);

        const meta = document.createElement("div");
        meta.className = "show-meta";
        meta.textContent = show.city;

        content.appendChild(title);
        content.appendChild(meta);
        card.appendChild(content);

        // Self-produced: "View Show" (leads to its landing page).
        // Upcoming: "Get Tickets" or a door note. Past: "View Event" (no note).
        let overlayText;
        if (isPast) {
          overlayText = clickable ? "View Event" : null;
        } else if (show.mine) {
          overlayText = "View Show";
        } else {
          overlayText = clickable ? "Get Tickets" : show.note;
        }
        if (overlayText) {
          const overlay = document.createElement("div");
          overlay.className = "show-overlay";
          overlay.textContent = overlayText;
          card.appendChild(overlay);
        }

        return card;
      }

      function renderShows() {
        const list = document.querySelector(".shows-list");
        if (!list) return;

        const today = todayISO();
        // Shows flagged `hidden: true` are staged but not shown yet.
        const visible = shows.filter((s) => !s.hidden);
        const upcoming = visible
          .filter((s) => s.date >= today)
          .sort((a, b) => {
            // Featured shows pinned to the top; everything else soonest-first.
            if (!!a.featured !== !!b.featured) return a.featured ? -1 : 1;
            return a.date.localeCompare(b.date);
          });
        const past = visible
          .filter((s) => s.date < today)
          .sort((a, b) => b.date.localeCompare(a.date)); // most recent first

        for (const show of upcoming) {
          list.appendChild(buildCard(show, false));
        }

        if (past.length) {
          const divider = document.createElement("div");
          divider.className = "shows-subheader";
          divider.textContent = "PAST SHOWS";
          list.appendChild(divider);

          for (const show of past) {
            list.appendChild(buildCard(show, true));
          }
        }
      }

      renderShows();
    </script>

    <script src="watch-config.js"></script>
    <script>
      // Show the "5-minute set" link only when the video is enabled
      // (see watch-config.js). Caption text comes from the same config.
      if (window.WATCH && window.WATCH.enabled) {
        var watchLine = document.getElementById("watch-line");
        var watchNote = document.getElementById("watch-note");
        if (watchLine) watchLine.hidden = false;
        if (watchNote && window.WATCH.caption) {
          watchNote.textContent = window.WATCH.caption;
          watchNote.hidden = false;
        }
      }
    </script>

    <script defer src="analytics.js"></script>
  </body>
</html>

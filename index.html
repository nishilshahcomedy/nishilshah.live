<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <title>Nishil Shah</title>

    <meta
      name="description"
      content="Nishil Shah — NYC-based standup comedian."
    />

    <!-- Link preview card (iMessage, Instagram, X, WhatsApp, etc.). -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nishilshah.live/" />
    <meta property="og:title" content="Nishil Shah" />
    <meta property="og:description" content="NYC-based standup comedian." />
    <meta property="og:image" content="https://nishilshah.live/images/portrait.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nishil Shah" />
    <meta name="twitter:description" content="NYC-based standup comedian." />
    <meta name="twitter:image" content="https://nishilshah.live/images/portrait.jpg" />

    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <main class="page">
      <!-- Intro -->
      <section class="intro">
        <img
          src="images/portrait.jpg"
          alt="Portrait of Nishil Shah"
          class="portrait"
        />

        <h1 class="name">Nishil Shah</h1>

        <p class="bio">
          NYC-based standup comedian.
        </p>

        <nav class="links">
          <a href="https://instagram.com/nishilshah12" target="_blank">Instagram</a>
          <a href="mailto:bookings@nishilshah.live">bookings@nishilshah.live</a>
        </nav>
      </section>

      <!-- Upcoming Shows -->
      <aside class="shows">
        <div class="shows-header">2026 SHOWS</div>
        <div class="shows-list"></div>
      </aside>
    </main>

    <script>
      // Add a show by adding one entry below. Dates are YYYY-MM-DD (sortable).
      //   url  — if set, the card links out and shows "Get Tickets" on hover.
      //          External URLs open in a new tab; internal paths (e.g. "/oct25")
      //          open in the same tab.
      //   mine — true for a self-produced show: gets a "NISHIL PRESENTS" badge,
      //          an accent border, and a "View Show" label. Point url at its own
      //          landing page, e.g. url: "/oct25" (copy the show-template folder).
      //   note — optional hover label for a non-ticketed card (e.g. door cover).
      // Example self-produced show:
      //   { date: "2026-10-25", venue: "Nishil Presents: The Show", city: "New York, NY", url: "/oct25", mine: true },
      const shows = [
        { date: "2026-01-10", venue: "Broadway Comedy Club", city: "New York, NY", url: "https://www.broadwaycomedyclub.com/" },
        { date: "2026-01-18", venue: "Whiskey Cellar", city: "New York, NY", url: "https://www.eventbrite.com/e/very-good-comedy-show-whiskey-cellar-tickets-1979647447807" },
        { date: "2026-03-01", venue: "Good Karma Comedy Festival", city: "Bethlehem, PA", url: "https://www.artsquest.org/event/good-karma-comedy-festival-clean-comedy-showcase/" },
        { date: "2026-04-01", venue: "Flop House", city: "New York, NY", url: "https://www.flophousecomedy.com/event/1984172217515" },
        { date: "2026-04-12", venue: "New York Comedy Club (UWS)", city: "New York, NY", url: "https://newyorkcomedyclub.com/events/next-gen-comics-2026-04-12160000" },
        { date: "2026-04-21", venue: "St. Marks Comedy Club", city: "New York, NY", url: "https://www.eventbrite.com/e/very-good-comedy-at-st-marks-april-21-tickets-1986904213990" },
        { date: "2026-05-19", venue: "St. Marks Comedy Club", city: "New York, NY", url: "https://www.eventbrite.com/e/very-good-comedy-at-st-marks-comedy-club-tickets-1988926548848?utm_experiment=test_share_listing&aff=ebdsshios" },
        { date: "2026-06-02", venue: "St. Marks Comedy Club (Gong Show)", city: "New York, NY" },
        { date: "2026-06-07", venue: "Local NY", city: "Queens, NY" },
        { date: "2026-06-16", venue: "St. Marks Comedy Club (Gong Show)", city: "New York, NY" },
        { date: "2026-06-19", venue: "One-and-One", city: "New York, NY", url: "https://www.eventbrite.com/e/very-good-comedy-at-one-and-one-tickets-1991562131948" },
        { date: "2026-06-20", venue: "Comedy Cellar", city: "New York, NY", note: "$5 cover in person" },
        { date: "2026-07-08", venue: "Whiskey Cellar", city: "New York, NY", url: "https://www.eventbrite.com/e/very-good-comedy-at-whiskey-cellar-july-8-tickets-1993348154991" },
        { date: "2026-07-21", venue: "St. Marks Comedy Club (Gong Show)", city: "New York, NY" },
        { date: "2026-07-28", venue: "St. Marks Comedy Club (Gong Show)", city: "New York, NY" },
        { date: "2026-08-01", venue: "Brooklyn Art Haus", city: "Brooklyn, NY", url: "https://www.eventbrite.com/e/very-good-comedy-at-brooklyn-art-haus-tickets-1996335185279" },
        { date: "2026-08-02", venue: "Local NY", city: "Queens, NY" },
        { date: "2026-08-15", venue: "Don't Tell Mama", city: "New York, NY" },
        { date: "2026-08-16", venue: "Whiskey Cellar", city: "New York, NY" },
        { date: "2026-08-23", venue: "Wild East Brewing Co.", city: "Brooklyn, NY" },
        { date: "2026-09-26", venue: "Flavor Cult", city: "Pond Eddy, NY" },
      ];

      const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

      // Parse the date parts by hand so there's no timezone shift (e.g. a UTC
      // date rendering as the previous day in New York).
      function formatShowDate(iso) {
        const [, month, day] = iso.split("-").map(Number);
        return MONTHS[month - 1] + " " + day;
      }

      // Today as a local YYYY-MM-DD string, so it compares directly against the
      // show dates without any timezone drift.
      function todayISO() {
        const now = new Date();
        const y = now.getFullYear();
        const m = String(now.getMonth() + 1).padStart(2, "0");
        const d = String(now.getDate()).padStart(2, "0");
        return y + "-" + m + "-" + d;
      }

      // Build one card. Past shows stay dimmed but remain clickable when they
      // have a link — it points at the (now-ended) event page for reference,
      // labeled "View Event" rather than "Get Tickets".
      function buildCard(show, isPast) {
        const clickable = !!show.url;
        const external = clickable && /^https?:\/\//.test(show.url);
        const card = document.createElement(clickable ? "a" : "div");
        card.className = "show-card";
        if (isPast) card.classList.add("past");
        if (show.mine) card.classList.add("mine");
        if (clickable) {
          card.href = show.url;
          // Only external links open a new tab; internal pages stay in-tab.
          if (external) {
            card.target = "_blank";
            card.rel = "noopener";
          }
        }

        const content = document.createElement("div");
        content.className = "show-content";

        if (show.mine) {
          const badge = document.createElement("div");
          badge.className = "show-badge";
          badge.textContent = "NISHIL PRESENTS";
          content.appendChild(badge);
        }

        const title = document.createElement("div");
        title.className = "show-title";
        title.textContent = show.venue + " — " + formatShowDate(show.date);

        const meta = document.createElement("div");
        meta.className = "show-meta";
        meta.textContent = show.city;

        content.appendChild(title);
        content.appendChild(meta);
        card.appendChild(content);

        // Self-produced: "View Show" (leads to its landing page).
        // Upcoming: "Get Tickets" or a door note. Past: "View Event" (no note).
        let overlayText;
        if (isPast) {
          overlayText = clickable ? "View Event" : null;
        } else if (show.mine) {
          overlayText = "View Show";
        } else {
          overlayText = clickable ? "Get Tickets" : show.note;
        }
        if (overlayText) {
          const overlay = document.createElement("div");
          overlay.className = "show-overlay";
          overlay.textContent = overlayText;
          card.appendChild(overlay);
        }

        return card;
      }

      function renderShows() {
        const list = document.querySelector(".shows-list");
        if (!list) return;

        const today = todayISO();
        const upcoming = shows
          .filter((s) => s.date >= today)
          .sort((a, b) => a.date.localeCompare(b.date)); // soonest first
        const past = shows
          .filter((s) => s.date < today)
          .sort((a, b) => b.date.localeCompare(a.date)); // most recent first

        for (const show of upcoming) {
          list.appendChild(buildCard(show, false));
        }

        if (past.length) {
          const divider = document.createElement("div");
          divider.className = "shows-subheader";
          divider.textContent = "PAST SHOWS";
          list.appendChild(divider);

          for (const show of past) {
            list.appendChild(buildCard(show, true));
          }
        }
      }

      renderShows();
    </script>
  </body>
</html>

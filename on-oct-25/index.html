<!DOCTYPE html>
<!--
  SHOW PAGE — nishilshah.live/on-oct-25  (Nishil Shah + Friends @ Flop House)
  LIVE: linked from the home page (featured card).

  Styles are in /event.css and signup logic in /event.js (shared by all show
  pages). Only edit this page's CONTENT + the OG tags below.

  STILL TODO:
    • Add flyer.jpg to this folder (portrait shows as default until then), and
      point og:image at it once added.
    • Add the show time to the details line if you want it.
    • Swap the blurb / lineup for your own wording + real names.
  Page is locked to one viewport height — keep copy short so it never scrolls.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="../favicon.png" type="image/png" />

    <title>Nishil Shah + Friends</title>
    <meta name="description" content="Nishil Shah + Friends — live stand-up at Flop House, NYC. Sunday, October 25." />

    <!-- Social share preview. Point og:image at flyer.jpg once you add it. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Nishil Shah + Friends" />
    <meta property="og:description" content="Live stand-up at Flop House, NYC — Sunday, October 25." />
    <meta property="og:image" content="https://nishilshah.live/images/portrait.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="../event.css" />
  </head>

  <body>
    <main class="event">
      <a class="event-back" href="../index.html">← All Shows</a>

      <!-- LEFT on laptop, TOP on mobile. Swap for the show flyer (flyer.jpg in
           this folder). Portrait is a working default so the page renders before
           you add art. -->
      <div class="event-flyer">
        <img class="event-poster" src="../images/portrait.jpg" alt="Nishil Shah + Friends flyer" />
      </div>

      <!-- RIGHT on laptop, BELOW on mobile. -->
      <div class="event-info">
        <p class="event-eyebrow">Nishil Shah Presents</p>
        <h1 class="event-title">Nishil Shah + Friends</h1>
        <p class="event-details">Sun, Oct 25 · Flop House · New York, NY</p>
        <p class="event-blurb">
          A night of stand-up — me and some of the funniest comics I know, one room.
        </p>
        <p class="event-lineup">Full lineup coming soon.</p>

        <!-- Links out to Flop House's box office to buy tickets. -->
        <a
          class="event-tickets"
          href="https://flophousecomedy.com/d4746cdc-a0b5-45ce-b897-afcb896b1851/event/d5cab7d9-10aa-4622-91fb-49ccc3478dfc"
          target="_blank"
          rel="noopener"
          >Get Tickets</a
        >

        <p class="event-signup-prompt">Can't make it? Sign up for the next one ⤵️</p>

        <!--
          Posts to Kit (form 9759877) via /event.js. To also capture city, add a
          custom field in Kit, then add an input here named fields[city].
        -->
        <form class="event-signup" action="https://app.kit.com/forms/9759877/subscriptions" method="post">
          <input type="email" name="email_address" placeholder="you@email.com" required />
          <button type="submit">Notify me</button>
        </form>
        <p class="event-signup-done" hidden>Thanks for signing up!</p>
      </div>
    </main>

    <script src="../event.js"></script>
    <script defer src="../analytics.js"></script>
  </body>
</html>

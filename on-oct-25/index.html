<!DOCTYPE html>
<!--
  SHOW PAGE — nishilshah.live/on-oct-25  (Nishil Shah + Friends @ Flop House)
  LIVE: linked from the home page (featured card).

  Styles are in /event.css and signup logic in /event.js (shared by all show
  pages). Only edit this page's CONTENT + the OG tags below.

  NOTE: no "← All Shows" link here on purpose — this page should convert to a
  ticket, not leak traffic to the other (non-self-produced) shows. Same rule
  as /subscribe.

  Page is locked to one viewport height — keep copy short so it never scrolls.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="../favicon.png" type="image/png" />

    <title>Nishil Shah + Friends</title>
    <meta name="description" content="Nishil Shah + Friends — live stand-up at Flop House Comedy Club, Williamsburg. Sunday, October 25. $12 early bird." />

    <!-- Social share preview. Point og:image at flyer.jpg once you add it. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Nishil Shah + Friends" />
    <meta property="og:description" content="Live stand-up at Flop House Comedy Club, Williamsburg — Sunday, October 25. $12 early bird." />
    <meta property="og:image" content="https://nishilshah.live/on-oct-25/flyer.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="../theme.css" />
    <link rel="stylesheet" href="../event.css" />
  </head>

  <body>
    <main class="event">
      <!-- LEFT on laptop, TOP on mobile. -->
      <div class="event-flyer">
        <!-- Alt text carries the lineup: the names are only on the flyer now,
             so this is the sole text copy for screen readers and search. -->
        <img
          class="event-poster"
          src="flyer.png"
          alt="Nishil Shah + Friends — live stand-up, 8PM Sunday October 25 2026 at Flop House Comedy Club. Featuring Daniela Mora, Alexis Carabaño, Michael Agunbiade, plus a guest TBA. Hosted by Spencer Wright."
        />
      </div>

      <!-- RIGHT on laptop, BELOW on mobile. -->
      <div class="event-info">
        <h1 class="event-title">Nishil Shah + Friends</h1>
        <!-- The address is hidden on mobile (see event.css) — it wraps the line
             and the box office page + ticket email both carry it. -->
        <p class="event-details">Sun, Oct 25 · Flop House<span class="event-address"> (362 Grand St, Brooklyn)</span></p>
        <p class="event-blurb">
          A fun night of standup feat. me and some of the funniest comics I know!
        </p>

        <!-- Price above the button, doors + address below it. Links out to
             Flop House's box office, which states the 8PM show time. -->
        <p class="event-price">$12 early bird · $15 after</p>
        <a
          class="event-tickets"
          href="https://flophousecomedy.com/d4746cdc-a0b5-45ce-b897-afcb896b1851/event/d5cab7d9-10aa-4622-91fb-49ccc3478dfc"
          target="_blank"
          rel="noopener"
          >Get Tickets</a
        >
        <p class="event-doors">Doors 7:30 · Show 8PM</p>

        <!-- On mobile this group pins to the bottom as a card (see event.css). -->
        <div class="event-signup-card">
          <p class="event-signup-prompt">Can't make it? Sign up for the next one <svg class="event-signup-arrow" width="16" height="16" viewBox="0 0 512 512" fill="currentColor" aria-hidden="true"><polygon points="283.7,298.7 283.7,0 198.3,0 198.3,298.7 70.3,298.7 241,512 411.7,298.7" /></svg></p>

          <!--
            Posts to Kit (form 9759877) via /event.js. To also capture city, add a
            custom field in Kit, then add an input here named fields[city].
          -->
          <form class="event-signup" action="https://app.kit.com/forms/9759877/subscriptions" method="post">
            <input type="email" name="email_address" placeholder="you@email.com" required />
            <!-- Attribution: needs a "source" custom field created in Kit to record. -->
            <input type="hidden" name="fields[source]" value="on-oct-25" />
            <button type="submit">Notify me</button>
          </form>
          <p class="event-signup-done" hidden>Thanks for signing up!</p>
        </div>
      </div>
    </main>

    <script src="../event.js"></script>
    <script defer src="../analytics.js"></script>
  </body>
</html>
